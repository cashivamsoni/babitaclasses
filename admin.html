<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Babita Classes - Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #fff6d9;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #ffffff;
        border-radius: 14px;
        padding: 28px 24px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      }
      .card h1 {
        font-size: 20px;
        margin: 0 0 18px;
        text-align: center;
        color: #800000;
      }
      label {
        display: block;
        font-size: 13px;
        color: #555;
        margin: 14px 0 4px;
      }
      input[type="email"],
      input[type="password"],
      input[type="date"] {
        width: 100%;
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 11px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #990000, #800000);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #logoutBtn {
        background: none;
        color: #800000;
        font-weight: 500;
        text-decoration: underline;
        margin-top: 6px;
      }
      .msg {
        font-size: 13px;
        margin: 10px 0 0;
        min-height: 16px;
      }
      .error { color: #c0392b; }
      .success { color: #1e8f2e; }
    </style>
  </head>
  <body>

    <div id="loginView" class="card">
      <h1>Admin Login</h1>
      <form id="loginForm">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" required autocomplete="username">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" required autocomplete="current-password">
        <button type="submit">Login</button>
        <p id="loginError" class="msg error"></p>
      </form>
    </div>

    <div id="adminView" class="card" style="display:none">
      <h1>Admin Panel</h1>
      <label for="lastUpdatedInput">Last Updated Date</label>
      <input type="date" id="lastUpdatedInput">
      <button id="saveBtn">Save</button>
      <p id="saveStatus" class="msg"></p>
      <button id="logoutBtn" type="button">Logout</button>
    </div>

    <script type="module" src="admin.05a481.js"></script>
  </body>
</html>
