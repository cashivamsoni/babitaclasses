<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Babita Classes - Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
      * { box-sizing: border-box; }
      html, body {
        min-height: 100%;
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #fff6d9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 0;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #ffffff;
        border-radius: 14px;
        padding: 28px 24px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      }
      .card h1 {
        font-size: 20px;
        margin: 0 0 18px;
        text-align: center;
        color: #800000;
      }
      label {
        display: block;
        font-size: 13px;
        color: #555;
        margin: 14px 0 4px;
      }
      input[type="email"],
      input[type="password"],
      input[type="date"],
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 11px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #990000, #800000);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #hubLogoutBtn, #editorLogoutBtn, #backToHubBtn {
        background: #800000;
        color: #fff;
        font-weight: 500;
        border-radius: 6px;
      }
      .msg {
        font-size: 13px;
        margin: 10px 0 0;
        min-height: 16px;
      }
      .error { color: #c0392b; }
      .success { color: #1e8f2e; }
      #noticeList li, #videoAdminList li {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
      }
      #noticeList li input[type="checkbox"], #videoAdminList li input[type="checkbox"] {
        width: auto;
        flex: none;
        display: none;
      }
      #noticeList.bulk-mode li input[type="checkbox"], #videoAdminList.bulk-mode li input[type="checkbox"] {
        display: inline-block;
      }
      #noticeList li span, #videoAdminList li span {
        flex: 1;
      }
      #noticeList button, #videoAdminList button {
        width: auto;
        margin: 0;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
      }
      #noticeList .edit-btn, #videoAdminList .edit-btn { background: #007bff; }
      #noticeList .delete-btn, #videoAdminList .delete-btn { background: #c0392b; }
      .hub-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
      }
      .hub-btn {
        width: 100%;
        margin: 0;
        padding: 16px 10px;
        font-size: 15px;
      }
      .hub-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        opacity: 0.7;
      }
      #hubLogoutBtn {
        width: auto;
        display: block;
        margin: 24px auto 0;
        padding: 6px 14px;
        font-size: 12px;
      }
      .section-divider {
        margin: 20px 0;
        border: none;
        border-top: 2px solid #bbb;
      }
      #undoToast {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: #222;
        color: #fff;
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 13px;
        align-items: center;
        gap: 14px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        z-index: 100;
      }
      #undoToastBtn {
        width: auto;
        margin: 0;
        padding: 0;
        background: none;
        color: #6fb8ff;
        font-weight: 700;
        text-decoration: underline;
        font-size: 13px;
      }
    </style>
  </head>
  <body>

    <div id="undoToast">
      <span id="undoToastMsg"></span>
      <button id="undoToastBtn" type="button">Undo</button>
    </div>

    <div id="loginView" class="card">
      <h1>Admin Login</h1>
      <form id="loginForm">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" required autocomplete="username">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" required autocomplete="current-password">
        <button type="submit">Login</button>
        <p id="loginError" class="msg error"></p>
      </form>
    </div>

    <div id="adminHub" class="card" style="display:none; width:clamp(280px, 92vw, 520px); max-width:none;">
      <h1>Admin Panel</h1>
      <div class="hub-grid">
        <button id="hubHomeBtn" type="button" class="hub-btn">Homepage</button>
        <button type="button" class="hub-btn" disabled title="Coming soon">Blog</button>
        <button type="button" class="hub-btn" disabled title="Coming soon">Results</button>
        <button type="button" class="hub-btn" disabled title="Coming soon">Attendance</button>
      </div>
      <button id="hubLogoutBtn" type="button">Logout</button>
    </div>

    <div id="adminView" class="card" style="display:none; max-width:480px; position:relative;">
      <button id="backToHubBtn" type="button" style="position:absolute; top:16px; left:16px; width:auto; margin:0; padding:6px 14px; font-size:12px;">← Back</button>
      <button id="editorLogoutBtn" type="button" style="position:absolute; top:16px; right:16px; width:auto; margin:0; padding:6px 14px; font-size:12px;">Logout</button>

      <h1>Admin Panel</h1>

      <p style="font-weight:600; margin:0 0 4px;">Notice Board</p>

      <label for="marqueeInput">Top Marquee Text</label>
      <textarea id="marqueeInput" rows="3" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid #ccc; border-radius:8px; font-family:inherit; resize:vertical;"></textarea>
      <button id="marqueeSaveBtn" type="button">Save Marquee</button>
      <p id="marqueeStatus" class="msg"></p>

      <label for="noticeInput">Add a Notice</label>
      <input type="text" id="noticeInput" placeholder="e.g. Diwali holidays from ...">
      <button id="noticeAddBtn" type="button">Add Notice</button>
      <p id="noticeStatus" class="msg"></p>
      <p style="font-size:12px; color:#777; margin:10px 0 4px;">Newest 3 notices show the "New" badge automatically.</p>
      <button id="noticeSelectModeBtn" type="button" style="width:auto; margin:0 0 8px; padding:6px 14px; font-size:12px; background:#555;">Select</button>
      <ul id="noticeList" style="list-style:none; padding:0; margin:6px 0 0;"></ul>
      <button id="noticeDeleteSelectedBtn" type="button" style="display:none; background:#c0392b;">Delete Selected</button>

      <hr class="section-divider">

      <p style="font-weight:600; margin:0 0 4px;">What's New Section</p>

      <label for="wnTextInput">Text</label>
      <textarea id="wnTextInput" rows="3" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid #ccc; border-radius:8px; font-family:inherit; resize:vertical;"></textarea>

      <label for="wnImageUrlInput">Image URL</label>
      <input type="text" id="wnImageUrlInput" placeholder="https://... or /images/...">

      <label for="wnBtnTextInput">Button Text</label>
      <input type="text" id="wnBtnTextInput" placeholder="e.g. Open Facebook Post">

      <label for="wnBtnUrlInput">Button URL</label>
      <input type="text" id="wnBtnUrlInput" placeholder="https://...">

      <button id="wnSaveBtn" type="button">Save What's New</button>
      <p id="wnStatus" class="msg"></p>

      <hr class="section-divider">

      <p style="font-weight:600; margin:0 0 4px;">Gallery Images (8 photos)</p>
      <div style="max-height:240px; overflow-y:auto; border:1px solid #eee; border-radius:8px; padding:10px 12px; margin-bottom:10px;">
        <label for="galleryInput1">Photo 1 URL</label>
        <input type="text" id="galleryInput1" placeholder="https://... or /images/...">
        <label for="galleryInput2">Photo 2 URL</label>
        <input type="text" id="galleryInput2" placeholder="https://... or /images/...">
        <label for="galleryInput3">Photo 3 URL</label>
        <input type="text" id="galleryInput3" placeholder="https://... or /images/...">
        <label for="galleryInput4">Photo 4 URL</label>
        <input type="text" id="galleryInput4" placeholder="https://... or /images/...">
        <label for="galleryInput5">Photo 5 URL</label>
        <input type="text" id="galleryInput5" placeholder="https://... or /images/...">
        <label for="galleryInput6">Photo 6 URL</label>
        <input type="text" id="galleryInput6" placeholder="https://... or /images/...">
        <label for="galleryInput7">Photo 7 URL</label>
        <input type="text" id="galleryInput7" placeholder="https://... or /images/...">
        <label for="galleryInput8">Photo 8 URL</label>
        <input type="text" id="galleryInput8" placeholder="https://... or /images/...">
      </div>
      <button id="gallerySaveBtn" type="button">Save Gallery</button>
      <p id="galleryStatus" class="msg"></p>

      <hr class="section-divider">

      <p style="font-weight:600; margin:0 0 4px;">Function Videos</p>
      <label for="videoTitleInput">Title</label>
      <input type="text" id="videoTitleInput" placeholder="e.g. Holi Celebration 2026">
      <label for="videoUrlInput">Video/Post URL</label>
      <input type="text" id="videoUrlInput" placeholder="https://youtu.be/...">
      <button id="videoAddBtn" type="button">Add Video</button>
      <p id="videoStatus" class="msg"></p>
      <button id="videoSelectModeBtn" type="button" style="width:auto; margin:8px 0; padding:6px 14px; font-size:12px; background:#555;">Select</button>
      <ul id="videoAdminList" style="list-style:none; padding:6px 12px; margin:6px 0 0; max-height:280px; overflow-y:auto; border:1px solid #eee; border-radius:8px;"></ul>
      <button id="videoDeleteSelectedBtn" type="button" style="display:none; background:#c0392b;">Delete Selected</button>

      <hr class="section-divider">

      <p style="text-align:center; color:#555; font-size:14px;">
        Logged in — today's date has been set as the site's "Last Updated" date automatically.
      </p>
      <p style="text-align:center; font-size:15px; margin:14px 0;">
        Last Updated: <strong id="lastUpdatedDisplay">—</strong>
      </p>
      <p id="saveStatus" class="msg"></p>
    </div>

    <script type="module" src="admin.05a481.js"></script>
  </body>
</html>
